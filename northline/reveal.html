<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your First Look · Northline Renovations</title>
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --green:#1f6f5c; --ink:#1d2421; --muted:#66706b; --line:#dfe5e2; --bg:#f6f8f7; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:Inter,system-ui,sans-serif; color:var(--ink); background:var(--bg); }
  header { padding:22px 16px 6px; text-align:center; }
  .brand { font-weight:700; letter-spacing:.04em; font-size:13px; text-transform:uppercase; color:var(--green); }
  h1 { font-size:28px; margin:8px 0 4px; }
  .sub { color:var(--muted); margin:0; }
  main { max-width:820px; margin:18px auto 50px; padding:0 16px; }
  .compare { position:relative; border-radius:14px; overflow:hidden; box-shadow:0 8px 28px rgba(0,0,0,.12); user-select:none; touch-action:none; background:#ddd; }
  .compare img { display:block; width:100%; }
  .compare .top { position:absolute; inset:0; overflow:hidden; width:50%; }
  .compare .top img { width:auto; height:100%; max-width:none; }
  .bar { position:absolute; top:0; bottom:0; left:50%; width:3px; background:#fff; transform:translateX(-50%); }
  .bar::after { content:'⇆'; position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:40px; height:40px; border-radius:50%; background:#fff; display:grid; place-items:center; color:var(--green); font-weight:700; box-shadow:0 2px 8px rgba(0,0,0,.2); }
  .tag { position:absolute; top:12px; padding:4px 10px; border-radius:20px; background:rgba(0,0,0,.55); color:#fff; font-size:12px; font-weight:600; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-top:18px; }
  @media (max-width:640px){ .grid { grid-template-columns:1fr; } }
  .card { background:#fff; border-radius:14px; padding:16px; box-shadow:0 4px 18px rgba(0,0,0,.06); }
  .card h3 { margin:0 0 10px; font-size:15px; }
  video { width:100%; border-radius:10px; display:block; background:#000; }
  audio { width:100%; }
  .quote { color:var(--muted); font-size:14px; font-style:italic; margin:10px 0 0; }
  .cta { display:block; text-align:center; margin:22px auto 0; max-width:360px; padding:16px; border-radius:10px; background:var(--green); color:#fff; font-weight:600; text-decoration:none; }
  .fine { text-align:center; font-size:12px; color:var(--muted); margin-top:12px; }
  .msg { text-align:center; padding:60px 16px; color:var(--muted); }
</style>
</head>
<body>
<header>
  <div class="brand" id="biz">Northline Renovations</div>
  <h1 id="title">Your first look</h1>
  <p class="sub">Drag the slider to compare today with what it could be.</p>
</header>
<main id="app"><div class="msg">Loading your design…</div></main>

<script>
const API = 'https://aifornoncoders.app.n8n.cloud/webhook/stl-reveal';
const app = document.getElementById('app');
const t = new URLSearchParams(location.search).get('t');

function el(html) { const d = document.createElement('div'); d.innerHTML = html.trim(); return d.firstChild; }
function esc(s) { return String(s || '').replace(/[&<>"]/g, function (c) { return ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' })[c]; }); }

async function load() {
  if (!t) { app.innerHTML = '<div class="msg">This link is missing its code. Please use the link from your email.</div>'; return; }
  try {
    const r = await fetch(API + '?t=' + encodeURIComponent(t));
    const d = await r.json();
    if (!d.ok) throw new Error('not found');
    render(d);
  } catch (e) {
    app.innerHTML = '<div class="msg">We couldn\'t find this design. It may still be on its way. Try again in a few minutes.</div>';
  }
}

function render(d) {
  document.getElementById('title').textContent = 'Hi ' + (d.first_name || 'there') + ', here\'s your first look';
  document.getElementById('biz').textContent = d.business;
  app.innerHTML = '';
  const cmp = el('<div class="compare" id="cmp"><img src="' + esc(d.after) + '" alt="Redesign"><div class="top"><img src="' + esc(d.before) + '" alt="Today"></div><div class="bar"></div><span class="tag" style="left:12px">Today</span><span class="tag" style="right:12px">First look</span></div>');
  app.appendChild(cmp);
  const top = cmp.querySelector('.top'), bar = cmp.querySelector('.bar'), topImg = top.querySelector('img');
  function size() { topImg.style.width = cmp.clientWidth + 'px'; }
  function move(x) { const r = cmp.getBoundingClientRect(); const p = Math.max(0, Math.min(1, (x - r.left) / r.width)); top.style.width = (p * 100) + '%'; bar.style.left = (p * 100) + '%'; }
  cmp.addEventListener('pointerdown', function (e) { cmp.setPointerCapture(e.pointerId); move(e.clientX); });
  cmp.addEventListener('pointermove', function (e) { if (e.buttons) move(e.clientX); });
  window.addEventListener('resize', size); cmp.querySelector('img').onload = size; size();

  const grid = el('<div class="grid"></div>');
  if (d.video) grid.appendChild(el('<div class="card"><h3>Watch it transform</h3><video src="' + esc(d.video) + '" controls playsinline muted autoplay loop></video></div>'));
  if (d.voice) grid.appendChild(el('<div class="card"><h3>A note from ' + esc(d.owner) + '</h3><audio src="' + esc(d.voice) + '" controls></audio><p class="quote">“' + esc(d.voice_script) + '”</p></div>'));
  app.appendChild(grid);
  app.appendChild(el('<a class="cta" href="' + esc(d.booking_url) + '">Book a free site visit</a>'));
  app.appendChild(el('<p class="fine">Concept image generated from your photo. Final design and pricing come after a site visit.</p>'));
}
load();
</script>
</body>
</html>
